name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build:
    name: Build
    permissions:
      actions: write
      contents: read
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@02fcd089a850e25bc6eff55f74db80c12b54391e # v2.3.4
    with:
      flake-check: false
      build: true
      build-command: nix build -L --no-link
      cache: true
      cache-save: true
      cache-hash-files: |
        **/*.nix
        flake.lock
        package.json
        pnpm-lock.yaml
        src/**
        public/**

  lint:
    name: Lint
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@02fcd089a850e25bc6eff55f74db80c12b54391e # v2.3.4
    with:
      flake-check: false
      build: true
      build-command: |
        nix develop --command bash -euo pipefail -c '
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm run format:check
        '

  actions:
    name: Actions Lint
    uses: manic-systems/workflows/.github/workflows/actions-lint.yml@02fcd089a850e25bc6eff55f74db80c12b54391e # v2.3.4

  required:
    name: Required Checks
    if: always()
    needs:
      - build
      - lint
      - actions
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
