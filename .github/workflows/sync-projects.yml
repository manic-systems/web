name: Sync projects

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-projects

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-projects.py

      - name: Open or update project index pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: automation/sync-projects
          delete-branch: true
          add-paths: src/content/projects/
          title: 'projects: sync public repositories'
          commit-message: 'projects: sync public repositories'
          body: Refresh the software index from the Manic Systems GitHub repository API.
